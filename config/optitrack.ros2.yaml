# vrpn_mocap client settings. Rig values (server, objects, base) live in .env.
# The top-level key must match the node name in the launch file, or it is
# ignored without warning.

vrpn_mocap_client:
  ros__parameters:
    port: 3883
    frame_id: world
    update_freq: 1000.0           # keep above Motive's rate, else samples arrive in bursts
    refresh_freq: 1.0             # rescan for new rigid bodies, Hz
    sensor_data_qos: true         # BEST_EFFORT: echo needs --qos-reliability best_effort
    multi_sensor: false
    use_vrpn_timestamps: false    # stamp on receipt; true needs a clock-synced Motive PC
